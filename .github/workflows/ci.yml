name: CI
on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: '1.16.x' }
          - { os: ubuntu-latest, go: 'stable' }
          - { os: macos-latest, go: 'stable' }
          - { os: windows-latest, go: 'stable' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -timeout=10m ./...
