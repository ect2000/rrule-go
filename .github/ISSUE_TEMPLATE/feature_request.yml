name: Feature request
description: Suggest a feature, such as a python-dateutil capability this library lacks.
labels: ["enhancement", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need to do?
      description: The problem you're trying to solve, in terms of your use.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The API or behaviour you'd like. Note any existing python-dateutil equivalent.
    validations:
      required: true
